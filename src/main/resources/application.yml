server:
  port: 8080

spring:
  application:
    name: self-mirror-agent

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/self_mirror_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:xu123456}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
      password: 123456

  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 4

  ai:
    model:
      # 双 chat starter（openai + ollama）共存：关闭 chat 自动装配，由 ChatModelConfig 手动构建
      # qwenChatModel / ollamaChatModel 两个 bean；embedding 保持 openai 自动装配（固定走 DashScope，
      # 与 Milvus 1024 维强耦合，严禁切换 provider，否则需全量重建向量 collection）
      chat: none
      embedding: openai
    openai:
      # 对接阿里云百炼（通义千问）OpenAI 兼容模式；api-key 只从环境变量注入，不设默认值
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id          # 雪花算法主键
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

resilience4j:
  retry:
    instances:
      agentCall:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
  circuitbreaker:
    instances:
      agentCall:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      agentCall:
        timeout-duration: 60s

mirror:
  llm:
    # 云端：通义千问（DashScope OpenAI 兼容模式）
    qwen:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      model: ${AI_CHAT_MODEL:qwen-plus}
      temperature: 0.7
    # 本地：Ollama（原生 API）
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      temperature: 0.7
    # 模型出入参日志（ModelIoLoggingAdvisor）：请求文本/回复文本/耗时/token 用量；生产可关
    io-log-enabled: ${LLM_IO_LOG_ENABLED:true}
    io-log-max-chars: 4000          # 单条文本截断上限（字符），≤0 = 不截断
    # 角色 → 主 provider + 降级 provider（none = 不降级）
    routing:
      conversation:      { provider: qwen,   fallback: ollama }  # 面向用户，可用性优先
      compliance:        { provider: qwen,   fallback: none }    # 安全关键链路，禁止降级到本地小模型
      event:             { provider: qwen,   fallback: none }    # 结构化输出，7b 模型 JSON 稳定性不足
      language-analysis: { provider: qwen,   fallback: none }    # 同上
      profile-report:    { provider: qwen,   fallback: ollama }  # 自由文本，可降级
      temp-summarize:    { provider: ollama, fallback: qwen }    # 重 token 轻质量，优先本地省成本
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    username: ${MILVUS_USERNAME:root}
    password: ${MILVUS_PASSWORD:Milvus}     # 留空 = 匿名连接（未开启认证的实例）
    message-collection: message_vector
    knowledge-collection: knowledge_vector
    event-collection: event_vector
    fact-collection: event_fact_vector
    embedding-dim: ${MILVUS_EMBEDDING_DIM:1024}
  agent:
    session-ttl-hours: 24          # 会话上下文 Redis 过期时间
    context-max-rounds: 8          # 对话上下文截取最近 N 轮
    low-confidence-threshold: 0.7  # 低于该置信度的标签标记为待确认
    max-regenerate-times: 2        # 合规不通过时最大重生成次数
    sub-task-max-retry: 2          # 子任务失败默认重试次数
    fragment-aggregation-enabled: true      # 碎片归集：用户话未说完时等待续说，超时主动追问
    fragment-window-seconds: 60             # 滑动归集窗口（秒）：每收到新碎片重置截止时间
    fragment-max-total-wait-seconds: 180    # 单轮归集总等待上限（秒），超过立即合并并强制澄清
    fragment-max-fragments: 5               # 单轮最多合并碎片数
    event-pipeline-enabled: true            # 情绪-事件关联链路总开关
    event-dedup-high-score: 0.92            # 查重高置信阈值（≥ 直接归并既有事件）
    event-dedup-low-score: 0.80             # 查重低置信阈值（之间走 LLM 裁决）
    event-time-decay-tau-days: 7            # rerank 时间衰减常数 τ（天）
    event-episode-gap-minutes: 30           # 超过该间隔再提及算「重提」
    event-finalize-minutes: 20              # EMERGING 事件静默该时长后定稿
    event-context-count: 3                  # 上下文注入最近提及事件个数
    event-search-topk: 5                    # 事件查重向量检索 TopK
  compliance:
    word-dict-path: classpath:compliance/sensitive-words.txt
    risk-log-enabled: true

logging:
  level:
    com.mirror.agent: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
