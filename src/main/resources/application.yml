server:
  port: 8080

spring:
  application:
    name: self-mirror-agent
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/self_mirror_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
      password: 123456

  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 4

  ai:
    model:
      # 双 chat starter（openai + ollama）共存：关闭 chat 自动装配，由 ChatModelConfig 手动构建
      # qwenChatModel / ollamaChatModel 两个 bean；embedding 保持 openai 自动装配（固定走 DashScope，
      # 与 Milvus 1024 维强耦合，严禁切换 provider，否则需全量重建向量 collection）
      chat: none
      embedding: openai
    openai:
      # 对接阿里云百炼（通义千问）OpenAI 兼容模式；api-key 只从环境变量注入，不设默认值
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL}

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id          # 雪花算法主键
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

resilience4j:
  retry:
    instances:
      agentCall:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
  circuitbreaker:
    instances:
      agentCall:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      agentCall:
        timeout-duration: 60s

mirror:
  llm:
    # 云端：通义千问（DashScope OpenAI 兼容模式）
    qwen:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      model: ${AI_CHAT_MODEL}
      temperature: 0.7
    # 本地：Ollama（原生 API）
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      model: ${OLLAMA_MODEL}
      temperature: 0.7
    # 模型出入参日志（ModelIoLoggingAdvisor）：请求文本/回复文本/耗时/token 用量；生产可关
    io-log-enabled: ${LLM_IO_LOG_ENABLED}
    io-log-max-chars: 4000          # 单条文本截断上限（字符），≤0 = 不截断
    # 角色 → 主 provider + 降级 provider（none = 不降级）
    routing:
      conversation:      { provider: qwen,   fallback: ollama }  # 面向用户，可用性优先
      compliance:        { provider: qwen,   fallback: none }    # 安全关键链路，禁止降级到本地小模型
      incident:             { provider: qwen,   fallback: none }    # 结构化输出，7b 模型 JSON 稳定性不足
      language-analysis: { provider: qwen,   fallback: none }    # 同上
      profile-report:    { provider: qwen,   fallback: ollama }  # 自由文本，可降级
      temp-summarize:    { provider: ollama, fallback: qwen }    # 重 token 轻质量，优先本地省成本
  milvus:
    host: ${MILVUS_HOST}
    port: ${MILVUS_PORT}
    username: ${MILVUS_USERNAME}
    password: ${MILVUS_PASSWORD}     # 留空 = 匿名连接（未开启认证的实例）
    message-collection: message_vector
    knowledge-collection: knowledge_vector
    incident-collection: incident_vector
    fact-collection: incident_fact_vector
    embedding-dim: ${MILVUS_EMBEDDING_DIM}
  agent:
    context-max-rounds: 8          # 对话上下文截取最近 N 轮
    low-confidence-threshold: 0.7  # 低于该置信度的标签标记为待确认
    max-regenerate-times: 2        # 合规不通过时最大重生成次数
    sub-task-max-retry: 2          # 子任务失败默认重试次数
    fragment-aggregation-enabled: true      # 碎片归集：用户话未说完时等待续说，超时主动追问
    fragment-window-seconds: 60             # 滑动归集窗口（秒）：每收到新碎片重置截止时间
    fragment-max-total-wait-seconds: 180    # 单轮归集总等待上限（秒），超过立即合并并强制澄清
    fragment-max-fragments: 5               # 单轮最多合并碎片数
    incident-pipeline-enabled: true            # 情绪-事由关联链路总开关
    incident-dedup-high-score: 0.92            # 查重高置信阈值（≥ 直接归并既有事由）
    incident-dedup-low-score: 0.80             # 查重低置信阈值（之间走 LLM 裁决）
    incident-time-decay-tau-days: 7            # rerank 时间衰减常数 τ（天）
    incident-episode-gap-minutes: 30           # 超过该间隔再提及算「重提」
    incident-finalize-minutes: 20              # EMERGING 事由静默该时长后定稿
    incident-context-count: 3                  # 上下文注入最近提及事由个数
    incident-search-topk: 5                    # 事由查重向量检索 TopK
    report-period-clarify-enabled: true        # 报告周期澄清：custom/statistic 未明示区间时反问一轮
    report-period-clarify-ttl-minutes: 10      # 澄清待办槽 TTL（分钟），超时后用户再答按新话题处理
    report-max-span-days: 90                   # 日历类锚点最大统计跨度（天），超出截断；事由锚豁免
  compliance:
    word-dict-path: classpath:compliance/sensitive-words.txt
    risk-log-enabled: true
  report:                                  # PDF 报告模块（JSON 契约 → FreeMarker → openhtmltopdf）
    default-template: report               # 模板：classpath:/templates/{id}.ftl
    date-format: yyyy-MM-dd HH:mm:ss       # generatedAt 展示格式
    time-zone: Asia/Shanghai               # generatedAt 格式化时区
    font-classpath: fonts/NotoSansSC-VF.ttf  # 内嵌中文字体（classpath 相对路径，Noto Sans SC 可变字体，OFL）
    font-family: Noto Sans CJK SC          # 字体注册名，必须与模板 CSS font-family 一致

logging:
  level:
    com.mirror.agent: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
